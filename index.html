<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美顔ケアノート</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C2264F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Today's care as large tap-to-check rows, weekly quota pips under it; calendar and settings are sibling views. */
:root{
  color-scheme:light;
  --bg:#FBF0F3; --surface:#FFFFFF; --sunken:#F6E0E6; --ink:#35131D; --muted:#7A5360; --line:#EBCCD5;
  --accent:#C2264F; --accent-ink:#FFFFFF; --accent-soft:#FBDBE4; --warn:#9A3412; --warn-soft:#FDE6D2;
  --g-bs:#B77900; --g-vl:#C2264F; --g-epi:#7446B8; --g-dl:#A88D96;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#1C1114; --surface:#2A1A1F; --sunken:#38232A; --ink:#F8E9ED; --muted:#CBA5B0; --line:#4D313A;
  --accent:#FF8FAB; --accent-ink:#3D0A1A; --accent-soft:#4A1F2C; --warn:#F6A66B; --warn-soft:#44240F;
  --g-bs:#F0B450; --g-vl:#FF8FAB; --g-epi:#B99CF0; --g-dl:#8F747D;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
h2{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunken);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:42px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.notice{border-radius:var(--r);padding:10px 14px;font-size:15px;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:18px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.daybar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.daybar button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.daybar button:disabled{opacity:.35;cursor:default}
.daybar .day{text-align:center;line-height:1.3}
.daybar .day strong{display:block;font-size:19px}

.care{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;border-left:6px solid var(--g)}
.care .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:transparent;margin-top:2px}
.care[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--g)}
.care[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.care .t{font-weight:700;font-size:17px;line-height:1.35}
.care .t .num{font-size:19px;font-weight:600;margin-left:8px;color:var(--muted);white-space:nowrap;display:inline-block}
.care .p{font-size:14px;color:var(--muted);line-height:1.5;margin-top:2px}
.care .s{font-size:14px;margin-top:4px}
.care .w{font-size:14px;color:var(--warn);font-weight:700;margin-top:4px}
.care.mini{padding:10px 12px}
.care.mini .t{font-size:16px}
.cares{display:flex;flex-direction:column;gap:10px}
.rest{background:var(--sunken);border-radius:12px;padding:14px;text-align:center}
.soon{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}

.quota{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;font-size:15px}
.quota + .quota{border-top:1px solid var(--line);padding-top:10px}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:18px;height:18px;border-radius:50%;border:2px solid var(--g);display:block}
.pips i.on{background:var(--g)}
.pips .num{font-size:18px;margin-left:6px;min-width:2.2em;text-align:right}

table.plan{width:100%;border-collapse:collapse;font-size:15px}
table.plan th{width:3em;text-align:left;font-weight:700;padding:8px 6px;vertical-align:top}
table.plan td{padding:8px 6px;vertical-align:top}
table.plan tr + tr th,table.plan tr + tr td{border-top:1px solid var(--line)}
table.plan tr.now{background:var(--accent-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);margin-right:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:13px;color:var(--muted);padding:2px 0}
.cal button{aspect-ratio:1/1.05;min-width:0;border:1px solid transparent;border-radius:10px;background:var(--bg);padding:3px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal button .num{font-size:17px;line-height:1.1}
.cal button.paused{background:var(--warn-soft)}
.cal button .cl{font-size:11px;font-weight:700;color:var(--warn);line-height:1}
.cal button.today{border-color:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:7px;height:7px;border-radius:50%;background:var(--g);display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:8px 4px;font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
.field input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px;color:var(--ink);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:8px 12px}
.second{min-height:50px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:16px;padding:6px 12px}
.pause{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:8px;font-size:15px}
.pause + .pause{border-top:1px solid var(--line);padding-top:8px}
.x{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:18px}
textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:14px;padding:10px 12px;resize:vertical}
.empty{color:var(--muted);font-size:16px;text-align:center;padding:8px 4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="rowhead"><h1>美顔ケアノート</h1><span class="muted small">この端末に保存</span></header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-view="today">今日のケア</button>
    <button role="tab" id="tab-cal" aria-selected="false" data-view="cal">カレンダー</button>
    <button role="tab" id="tab-set" aria-selected="false" data-view="set">設定</button>
  </div>
  <div class="notice" id="notice" hidden></div>

  <section class="view" id="view-today">
    <div class="daybar">
      <button id="prevDay" aria-label="前の日">‹</button>
      <div class="day"><span class="muted small" id="dayLabel"></span><strong id="dayText"></strong></div>
      <button id="nextDay" aria-label="次の日">›</button>
    </div>
    <div class="panel">
      <div class="rowhead"><h2 id="menuTitle">今日のメニュー</h2><span class="muted small">やったらタップ</span></div>
      <div class="cares" id="menu"></div>
    </div>
    <div class="panel">
      <h2>今週の回数（月〜日）</h2>
      <div id="quota"></div>
    </div>
    <div class="panel">
      <h2>予定以外のケアを記録</h2>
      <div class="cares" id="others"></div>
    </div>
  </section>

  <section class="view" id="view-cal" hidden>
    <div class="panel">
      <div class="rowhead"><button class="link" id="prevMon" aria-label="前の月">‹ 前の月</button><h2 id="monTitle"></h2><button class="link" id="nextMon" aria-label="次の月">次の月 ›</button></div>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
      <div id="dayDetail"></div>
    </div>
    <div class="panel">
      <h2>1週間の流れ</h2>
      <table class="plan" id="plan"></table>
      <div class="muted small">強いケアは1日1つ、日曜は回復の日。メーカーの頻度の範囲で組んだ目安です。</div>
    </div>
  </section>

  <section class="view" id="view-set" hidden>
    <div class="panel">
      <h2>クリニックの施術</h2>
      <div class="muted small">施術日を登録すると、その前後は自動でメニューが「お休み」になり、再開日も出ます。休む日数は仮の値です。クリニックで言われた日数に直してください。</div>
      <label class="field">施術名<input type="text" id="cName" maxlength="30" placeholder="例：ソノクイーン"></label>
      <label class="field">施術日<input type="date" id="cDate"></label>
      <div class="two">
        <label class="field">前に休む日数<input type="number" id="cBefore" inputmode="numeric" min="0" max="60" value="2"></label>
        <label class="field">後に休む日数<input type="number" id="cAfter" inputmode="numeric" min="0" max="90" value="7"></label>
      </div>
      <button class="primary" id="cAdd" type="button">施術を登録</button>
      <div id="clinics"></div>
    </div>
    <div class="panel">
      <h2>そのほかのお休み期間</h2>
      <div class="muted small">旅行や肌の調子が悪いときなど、機器を休む期間を入れておけます。</div>
      <div class="two">
        <label class="field">はじめ<input type="date" id="pFrom"></label>
        <label class="field">おわり<input type="date" id="pTo"></label>
      </div>
      <label class="field">メモ<input type="text" id="pLabel" maxlength="30" placeholder="例：旅行"></label>
      <button class="second" id="pAdd" type="button">お休み期間を追加</button>
      <div id="pauses"></div>
    </div>
    <div class="panel">
      <h2>バックアップ</h2>
      <div class="small" id="bkNote"></div>
      <button class="primary" id="bkCopy" type="button">記録をコピーする</button>
      <div class="muted small">コピーしたものをClaudeのチャットに貼り付けると、Notion日記に保存できます。</div>
      <textarea id="bkText" rows="4" placeholder="機種変更などで記録を戻すときは、コピーしておいた内容をここに貼り付けます"></textarea>
      <button class="second" id="bkLoad" type="button">貼り付けた記録を読み込む</button>
    </div>
  </section>
</div>

<script>
(function(){
/* Frequencies follow the makers' pages: Brightshot 3/week; Vitalift special care 2-3/week, one special mode per day; daily care once a day; ReFa EPI same area at most once a week. */
const G={bs:"ブライトショット",vl:"バイタリフト スペシャルケア",epi:"リファ エピ",dl:"バイタリフト デイリーケア"};
const ITEMS={
 bs:{dev:"ブライトショット",mode:"全顔ケア",min:10,g:"bs",prep:"洗顔後の素肌に、何もつけずに当てます。目・まぶた・眉・唇・耳は避けます。"},
 lift:{dev:"バイタリフト",mode:"RF×EMS LIFT",min:6,g:"vl",prep:"化粧水のあと、ジェルか化粧品をたっぷり。オイルや油分の多いクリームは使えません。"},
 pump:{dev:"バイタリフト",mode:"RF PUMP",min:6,g:"vl",prep:"化粧水のあと、ジェルか化粧品をたっぷり。ゆっくり引き上げるように動かします。"},
 eye:{dev:"バイタリフト",mode:"EYE CARE",min:2,g:"vl",prep:"目もと専用。まぶたには使いません。"},
 epi:{dev:"リファ エピ",mode:"顔",min:0,g:"epi",prep:"洗顔後の素肌に、フェイス用アタッチメントで。目・眉のまわり、唇、首には使いません。"},
 moist:{dev:"バイタリフト",mode:"MOIST",min:3,g:"dl",prep:"スキンケアをなじませるケア。1日1回まで。"},
 clean:{dev:"バイタリフト",mode:"CLEAN",min:3,g:"dl",prep:"ヘッドにコットンをつけ、化粧水をしみこませて。1日1回まで。"}};
const ORDER=["bs","lift","pump","eye","epi","moist","clean"];
const PLAN={1:["bs"],2:["lift","moist"],3:["bs"],4:["pump","moist"],5:["bs"],6:["epi","eye"],0:["moist"]};
const WD=["日","月","火","水","木","金","土"];
const LS="biyou-note-v1",LS_BK="biyou-note-backup-at";
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtDay=s=>{const d=parse(s);return (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）"};
const fmtShort=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()};
const today=()=>ymd(new Date());
const label=id=>ITEMS[id].dev+" "+ITEMS[id].mode;

const S={log:new Map(),pauses:[],clinics:[],date:today(),view:"today",month:today().slice(0,7),sel:today()};
function save(){try{localStorage.setItem(LS,JSON.stringify({log:[...S.log],pauses:S.pauses,clinics:S.clinics}))}catch(e){notice("保存できませんでした。ブラウザの空き容量をご確認ください。",true)}}
function load(){try{const o=JSON.parse(localStorage.getItem(LS)||"null");if(o){S.log=new Map((o.log||[]).filter(([d,a])=>Array.isArray(a)&&a.length));S.pauses=Array.isArray(o.pauses)?o.pauses:[];S.clinics=Array.isArray(o.clinics)?o.clinics:[]}}catch(e){}}
function notice(msg,warn){const n=$("notice");if(!msg){n.hidden=true;return}n.textContent=msg;n.className="notice"+(warn?" warn":"");n.hidden=false}

const done=(d,id)=>(S.log.get(d)||[]).includes(id);
const weekOf=d=>{const s=shift(d,-((parse(d).getDay()+6)%7));return Array.from({length:7},(_,i)=>shift(s,i))};
const clinicSpan=c=>({from:shift(c.date,-c.before),to:shift(c.date,c.after),label:c.name||"クリニックの施術",clinic:c});
const clinicOn=d=>S.clinics.find(c=>c.date===d)||null;
const pauseOn=d=>{const c=S.clinics.map(clinicSpan).filter(p=>p.from<=d&&d<=p.to).sort((a,b)=>a.to<b.to?1:-1)[0];return c||S.pauses.find(p=>p.from<=d&&d<=p.to)||null};
/* First day after d that is outside every rest window. */
function resumeDay(d){let x=shift(d,1),n=0;while(pauseOn(x)&&n++<400)x=shift(x,1);return x}
function lastDone(id,before){let best="";S.log.forEach((a,d)=>{if(d<before&&a.includes(id)&&d>best)best=d});return best}
function weekCount(g,d,skip){return weekOf(d).filter(x=>x!==skip&&(S.log.get(x)||[]).some(i=>ITEMS[i].g===g)).length}
/* Reasons to hold off on logging `id` on day `d` (ignoring whether it is already logged). */
function warnings(id,d){
  const it=ITEMS[id],w=[],dayIds=(S.log.get(d)||[]).filter(i=>i!==id),p=pauseOn(d);
  if(p)w.push("お休み期間中です"+(p.label?"（"+p.label+"）":""));
  if(it.g==="vl"){
    if(dayIds.some(i=>ITEMS[i].g==="vl"))w.push("スペシャルケアは1日1モードまでです");
    else if(weekCount("vl",d,d)>=3)w.push("今週のスペシャルケアは3回済みです");
  }
  if(id==="bs"&&weekCount("bs",d,d)>=3)w.push("今週のブライトショットは3回済みです");
  if(id==="epi"){
    let near="";S.log.forEach((a,x)=>{if(x!==d&&a.includes("epi")&&Math.abs(diff(x,d))<7)near=x});
    if(near)w.push("同じ場所は1週間あけます（"+fmtShort(near)+"に使用）");
  }
  const strong=i=>["bs","epi","lift","pump"].includes(i);
  if(!w.length&&strong(id)&&dayIds.some(strong))w.push("強いケアは1日1つが目安です");
  return w;
}
function toggle(id,d){
  const a=(S.log.get(d)||[]).slice(),i=a.indexOf(id);
  if(i>=0){a.splice(i,1);notice("")}
  else{const w=warnings(id,d);a.push(id);notice(w.length?label(id)+"を記録しました。"+w.join("。")+"。":"",true)}
  if(a.length)S.log.set(d,a);else S.log.delete(d);
  save();render();
}
function careRow(id,d,mini){
  const it=ITEMS[id],on=done(d,id),b=el("button","care"+(mini?" mini":""));b.type="button";b.style.setProperty("--g","var(--g-"+it.g+")");
  b.setAttribute("aria-pressed",String(on));b.appendChild(el("span","ck","✓"));
  const body=el("span"),t=el("div","t",it.dev+"　"+it.mode);if(it.min)t.appendChild(el("span","num","約"+it.min+"分"));body.appendChild(t);
  if(!mini)body.appendChild(el("div","p",it.prep));
  const last=lastDone(id,d);
  if(on)body.appendChild(el("div","s","記録済み。もう一度タップで取り消し"));
  else{
    const w=warnings(id,d);
    if(w.length)body.appendChild(el("div","w",w.join("／")));
    else if(!mini||last)body.appendChild(el("div","s muted",last?"前回 "+fmtShort(last)+"（"+diff(d,last)+"日前）":"はじめての記録です"));
  }
  b.appendChild(body);b.onclick=()=>toggle(id,d);return b;
}
function renderToday(){
  const d=S.date,t=today();
  $("dayLabel").textContent=d===t?"今日":d===shift(t,-1)?"昨日":parse(d).getFullYear()+"年";
  $("dayText").textContent=fmtDay(d);$("nextDay").disabled=d>=t;
  $("menuTitle").textContent=(d===t?"今日":fmtShort(d))+"のメニュー";
  const menu=$("menu"),plan=PLAN[parse(d).getDay()],p=pauseOn(d);menu.textContent="";
  if(p){
    const r=el("div","rest"),c=p.clinic,k=c?diff(d,c.date):0;
    r.appendChild(el("strong",null,c?(k===0?"今日はクリニックの施術日":k<0?"施術前のお休み期間":"施術後のお休み期間"):"お休み期間です"));
    r.appendChild(el("div","small muted",(c?(c.name||"施術")+"（"+fmtShort(c.date)+"）"+(k<0?"まであと"+(-k)+"日":k>0?"から"+k+"日目":"")+"。":(p.label?p.label+"。":""))+"機器はお休みです。再開は"+fmtDay(resumeDay(d))+"から。"));
    menu.appendChild(r);
  }
  else{
    const next=S.clinics.map(clinicSpan).filter(x=>x.from>d&&diff(x.from,d)<=14).sort((a,b)=>a.from<b.from?-1:1)[0];
    if(next)menu.appendChild(el("div","soon",(next.clinic.name||"施術")+"（"+fmtShort(next.clinic.date)+"）に向けて、"+fmtDay(next.from)+"から機器はお休みに入ります。"));
    if(parse(d).getDay()===0){const r=el("div","rest");r.appendChild(el("strong",null,"今日は回復の日"));r.appendChild(el("div","small muted","光やRFのケアはお休み。MOISTは足しても大丈夫です。"));menu.appendChild(r)}
    plan.forEach(id=>menu.appendChild(careRow(id,d)));
  }
  const q=$("quota");q.textContent="";
  [["bs",3,"週3回"],["vl",3,"週2〜3回"],["epi",1,"週1回まで"]].forEach(([g,max,txt])=>{
    const n=weekCount(g,d),row=el("div","quota");row.style.setProperty("--g","var(--g-"+g+")");
    const name=el("div",null,G[g]);name.appendChild(el("div","small muted",txt));row.appendChild(name);
    const pips=el("div","pips");for(let i=0;i<Math.max(max,n);i++)pips.appendChild(el("i",i<n?"on":""));pips.appendChild(el("span","num",n+"/"+max));row.appendChild(pips);q.appendChild(row);
  });
  const others=$("others");others.textContent="";
  const shown=p?[]:plan;ORDER.filter(id=>!shown.includes(id)).forEach(id=>others.appendChild(careRow(id,d,true)));
}
function renderCal(){
  const [y,m]=S.month.split("-").map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),t=today();
  $("monTitle").textContent=y+"年"+m+"月";$("nextMon").disabled=S.month>=t.slice(0,7);
  const cal=$("cal");cal.textContent="";["月","火","水","木","金","土","日"].forEach(w=>cal.appendChild(el("div","wd",w)));
  for(let i=0;i<(first.getDay()+6)%7;i++)cal.appendChild(el("div"));
  for(let n=1;n<=days;n++){
    const d=S.month+"-"+String(n).padStart(2,"0"),b=el("button",(pauseOn(d)?"paused ":"")+(d===t?"today":""));b.type="button";
    b.setAttribute("aria-pressed",String(d===S.sel));b.appendChild(el("span","num",String(n)));
    const cl=clinicOn(d);if(cl)b.appendChild(el("span","cl","施術"));
    const ids=S.log.get(d)||[],dots=el("span","dots");
    ["bs","vl","epi","dl"].forEach(g=>{if(ids.some(i=>ITEMS[i].g===g)){const i=el("i");i.style.setProperty("--g","var(--g-"+g+")");dots.appendChild(i)}});
    b.appendChild(dots);b.setAttribute("aria-label",fmtDay(d)+(cl?" クリニックの施術":"")+(ids.length?" "+ids.map(label).join("、"):" 記録なし"));
    b.onclick=()=>{S.sel=d;renderCal()};cal.appendChild(b);
  }
  const lg=$("legend");lg.textContent="";Object.keys(G).forEach(g=>{const s=el("span"),i=el("span","dot");i.style.setProperty("--g","var(--g-"+g+")");s.appendChild(i);s.appendChild(document.createTextNode(G[g]));lg.appendChild(s)});
  const s=el("span");s.appendChild(document.createTextNode("薄い色の日はお休み期間、「施術」はクリニックの日"));lg.appendChild(s);
  const det=$("dayDetail");det.textContent="";
  const head=el("div","rowhead");head.appendChild(el("h2",null,fmtDay(S.sel)));
  if(S.sel<=t){const o=el("button","link","この日を開く");o.type="button";o.onclick=()=>{S.date=S.sel;setView("today")};head.appendChild(o)}
  det.appendChild(head);
  const ids=S.log.get(S.sel)||[],p=pauseOn(S.sel);
  const cd=clinicOn(S.sel);
  if(cd)det.appendChild(el("div",null,"クリニックの施術："+(cd.name||"（名前なし）")));
  if(p)det.appendChild(el("div","small muted","お休み期間"+(p.label?"（"+p.label+"）":"")+"　再開は"+fmtShort(resumeDay(S.sel))+"から"));
  if(!ids.length)det.appendChild(el("div","empty","記録はありません。"));
  ORDER.filter(i=>ids.includes(i)).forEach(i=>{const r=el("div");const dot=el("span","dot");dot.style.setProperty("--g","var(--g-"+ITEMS[i].g+")");r.appendChild(dot);r.appendChild(document.createTextNode(label(i)));det.appendChild(r)});
  const plan=$("plan");plan.textContent="";
  [1,2,3,4,5,6,0].forEach(w=>{const tr=el("tr",w===new Date().getDay()?"now":"");tr.appendChild(el("th",null,WD[w]));
    const td=el("td");PLAN[w].forEach((i,k)=>{const r=el("div",ITEMS[i].g==="dl"?"muted":"");const dot=el("span","dot");dot.style.setProperty("--g","var(--g-"+ITEMS[i].g+")");r.appendChild(dot);r.appendChild(document.createTextNode((w===0&&k===0?"お休み（":"")+label(i)+(ITEMS[i].g==="dl"?" を足しても可":"")+(w===0&&k===0?"）":"")));td.appendChild(r)});
    tr.appendChild(td);plan.appendChild(tr)});
}
function renderSet(){
  const cb=$("clinics");cb.textContent="";
  S.clinics.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(c=>{
    const sp=clinicSpan(c),r=el("div","pause"),t=el("div",null,fmtDay(c.date)+"　"+(c.name||"施術"));
    t.appendChild(el("div","small muted","お休み "+fmtShort(sp.from)+"〜"+fmtShort(sp.to)+"（前"+c.before+"日・後"+c.after+"日）"));r.appendChild(t);
    const x=el("button","x","×");x.type="button";x.setAttribute("aria-label","この施術の登録を消す");x.onclick=()=>{S.clinics=S.clinics.filter(q=>q!==c);save();render()};r.appendChild(x);cb.appendChild(r)});
  const box=$("pauses");box.textContent="";
  S.pauses.slice().sort((a,b)=>a.from<b.from?1:-1).forEach(p=>{
    const r=el("div","pause"),t=el("div",null,fmtDay(p.from)+" 〜 "+fmtDay(p.to));if(p.label)t.appendChild(el("div","small muted",p.label));r.appendChild(t);
    const x=el("button","x","×");x.type="button";x.setAttribute("aria-label","このお休み期間を消す");x.onclick=()=>{S.pauses=S.pauses.filter(q=>q!==p);save();render()};r.appendChild(x);box.appendChild(r)});
  let at=null;try{at=localStorage.getItem(LS_BK)}catch(e){}
  const n=$("bkNote"),days=at?diff(today(),at):null;
  n.textContent=!S.log.size?"記録はこのスマホの中に保存されています。":at?(days===0?"今日バックアップ済みです。":"前回のバックアップは"+days+"日前（"+fmtShort(at)+"）です。"+(days>=7?"そろそろコピーしておきましょう。":"")):"まだバックアップしていません。記録はこのスマホの中にだけあります。";
  n.style.color=S.log.size&&(!at||days>=7)?"var(--warn)":"var(--muted)";
}
function render(){if(S.view==="today")renderToday();else if(S.view==="cal")renderCal();else renderSet()}
function setView(v){S.view=v;["today","cal","set"].forEach(n=>{$("view-"+n).hidden=n!==v;$("tab-"+n).setAttribute("aria-selected",String(n===v))});if(v!=="today")notice("");render();window.scrollTo(0,0)}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("prevDay").onclick=()=>{S.date=shift(S.date,-1);notice("");render()};
$("nextDay").onclick=()=>{if(S.date<today()){S.date=shift(S.date,1);notice("");render()}};
const monShift=n=>{const [y,m]=S.month.split("-").map(Number),d=new Date(y,m-1+n,1);S.month=ymd(d).slice(0,7);renderCal()};
$("prevMon").onclick=()=>monShift(-1);$("nextMon").onclick=()=>monShift(1);
$("pAdd").onclick=()=>{
  const f=$("pFrom").value,t=$("pTo").value||f;
  if(!f){notice("はじめの日を選んでください。",true);return}
  if(t<f){notice("おわりの日は、はじめの日より後にしてください。",true);return}
  S.pauses.push({from:f,to:t,label:$("pLabel").value.trim()});save();$("pFrom").value=$("pTo").value=$("pLabel").value="";notice("お休み期間を追加しました。");render();
};
$("cAdd").onclick=()=>{
  const date=$("cDate").value,nb=parseInt($("cBefore").value,10),na=parseInt($("cAfter").value,10);
  if(!date){notice("施術日を選んでください。",true);return}
  if(!(nb>=0&&nb<=60)||!(na>=0&&na<=90)){notice("休む日数は、前は0〜60、後は0〜90の数字で入れてください。",true);return}
  const c={date:date,name:$("cName").value.trim(),before:nb,after:na};S.clinics.push(c);save();
  $("cName").value=$("cDate").value="";const sp=clinicSpan(c);
  notice("登録しました。"+fmtDay(sp.from)+"〜"+fmtDay(sp.to)+"は機器をお休みにします。");render();
};
const backupText=()=>JSON.stringify({app:"biyou-note",exported:today(),log:[...S.log].sort(),pauses:S.pauses,clinics:S.clinics});
$("bkCopy").onclick=()=>{
  const t=backupText(),box=$("bkText"),ok=()=>{try{localStorage.setItem(LS_BK,today())}catch(e){}renderSet();$("bkCopy").textContent="コピーしました";setTimeout(()=>{$("bkCopy").textContent="記録をコピーする"},2500)};
  const fb=()=>{box.value=t;box.focus();box.select();notice("自動でコピーできませんでした。下の欄の文字を全部選んでコピーしてください。")};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
};
$("bkLoad").onclick=()=>{
  try{
    const o=JSON.parse($("bkText").value.trim());if(!o||!Array.isArray(o.log))throw 0;
    let n=0;o.log.forEach(([d,a])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(a)){const ids=a.filter(i=>ITEMS[i]);if(ids.length){S.log.set(d,ids);n++}}});
    if(Array.isArray(o.pauses))o.pauses.forEach(p=>{if(p&&p.from&&p.to&&!S.pauses.some(q=>q.from===p.from&&q.to===p.to))S.pauses.push({from:p.from,to:p.to,label:String(p.label||"")})});
    if(Array.isArray(o.clinics))o.clinics.forEach(c=>{if(c&&c.date&&!S.clinics.some(q=>q.date===c.date&&q.name===c.name))S.clinics.push({date:c.date,name:String(c.name||""),before:Number(c.before)||0,after:Number(c.after)||0})});
    save();$("bkText").value="";notice(n+"日分の記録を読み込みました。");render();
  }catch(e){notice("読み込めませんでした。コピーした内容をそのまま貼り付けてください。",true)}
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();render();
})();
</script>
</body>
</html>
